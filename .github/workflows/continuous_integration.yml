name: CI
on:
  push:
    branches-ignore: ['gh-readonly-queue/**']
    tags: ['**']
jobs:

  node:
    name: node-v${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [22, 24]
    env:
      NODE_VERSION: ${{ matrix.version }}
    outputs:
      node-v22: ${{ steps.result.outputs.node-v22 }}
      node-v24: ${{ steps.result.outputs.node-v24 }}
    runs-on: [self-hosted, Linux, X64, Docker]
    container:
      image: carta/frontend-builder
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fix ownership
        run: |
          chown -R $(id -u):$(id -g) $PWD

      - name: Use precompiled WASM libraries
        shell: bash
        run: |
          set -e

          cp -a /opt/carta/wasm_libs/built ./wasm_libs/

          mkdir -p ./wasm_libs/zstd/build
          cp /opt/carta/wasm_libs/zstd/build/standalone_zstd.a \
             ./wasm_libs/zstd/build/

          test -s ./wasm_libs/built/lib/libast.a
          test -s ./wasm_libs/built/lib/libgsl.a
          test -s ./wasm_libs/built/lib/libgslcblas.a
          test -s ./wasm_libs/built/lib/libzfp.a
          test -s ./wasm_libs/zstd/build/standalone_zstd.a

      - name: npm install with Node.js ${{ matrix.version }}
        shell: bash
        run: |
          n "$NODE_VERSION"
          n exec "$NODE_VERSION" node -v
          n exec "$NODE_VERSION" npm install

      - name: Production build with Node.js ${{ matrix.version }}
        shell: bash
        run: |
          source /emsdk/emsdk_env.sh
          export PATH="$(dirname "$(find /usr/local/n/versions/node -path "*/$NODE_VERSION.*/bin/node" -print -quit)"):$PATH"
          node -v
          npm run build

      - name: Run unit tests
        shell: bash
        run: |
          n exec "$NODE_VERSION" npm test

      - name: Record result
        id: result
        if: always()
        run: printf 'node-v%s=%s\n' "$NODE_VERSION" "${{ job.status }}" >> "$GITHUB_OUTPUT"

  Notify:
    name: Summarize CI results
    runs-on: ubuntu-latest
    needs: node
    if: always()
    steps:
      - name: Write job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          | Check | Result |
          | --- | --- |
          | Node.js 22 | ${{ needs.node.outputs.node-v22 || 'unavailable' }} |
          | Node.js 24 | ${{ needs.node.outputs.node-v24 || 'unavailable' }} |
          EOF
