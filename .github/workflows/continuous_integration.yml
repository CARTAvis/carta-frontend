name: CI
on: [push]
jobs:

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install
      - run: npm run checkformat

  doc-format-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs_website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run checkformat

  test-doc:
    name: Test deployment of the documentation website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs_website
    needs: doc-format-check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Test build website
        run: npm run build

  node-v24:
    runs-on: [self-hosted, Linux, X64, Docker]
    needs: format-check
    container:
      image: carta/frontend-builder-test
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fix ownership
        run: |
          chown -R $(id -u):$(id -g) $PWD

      - name: Use precompiled WASM libraries
        shell: bash
        run: |
          set -e

          cp -a /opt/carta/wasm_libs/built ./wasm_libs/

          mkdir -p ./wasm_libs/zstd/build
          cp /opt/carta/wasm_libs/zstd/build/standalone_zstd.a \
             ./wasm_libs/zstd/build/

          test -s ./wasm_libs/built/lib/libast.a
          test -s ./wasm_libs/built/lib/libgsl.a
          test -s ./wasm_libs/built/lib/libgslcblas.a
          test -s ./wasm_libs/built/lib/libzfp.a
          test -s ./wasm_libs/zstd/build/standalone_zstd.a

      - name: npm install with node 24
        shell: bash
        run: |
          n 24
          n exec 24 node -v
          n exec 24 npm install

      - name: Production build with node 24
        shell: bash
        run: |
          source /emsdk/emsdk_env.sh
          export PATH="$(dirname "$(find /usr/local/n/versions/node -path '*/24.*/bin/node' -print -quit)"):$PATH"
          node -v
          npm run build

      - name: Run unit tests
        shell: bash
        run: |
          n exec 24 npm test

  node-v22:
    runs-on: [self-hosted, Linux, X64, Docker]
    needs: format-check
    container:
      image: carta/frontend-builder-test
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fix ownership
        run: |
          chown -R $(id -u):$(id -g) $PWD

      - name: Use precompiled WASM libraries
        shell: bash
        run: |
          set -e

          cp -a /opt/carta/wasm_libs/built ./wasm_libs/

          mkdir -p ./wasm_libs/zstd/build
          cp /opt/carta/wasm_libs/zstd/build/standalone_zstd.a \
             ./wasm_libs/zstd/build/

          test -s ./wasm_libs/built/lib/libast.a
          test -s ./wasm_libs/built/lib/libgsl.a
          test -s ./wasm_libs/built/lib/libgslcblas.a
          test -s ./wasm_libs/built/lib/libzfp.a
          test -s ./wasm_libs/zstd/build/standalone_zstd.a

      - name: npm install with node 22
        shell: bash
        run: |
          n 22
          n exec 22 node -v
          n exec 22 npm install

      - name: Production build with node 22
        shell: bash
        run: |
          source /emsdk/emsdk_env.sh
          export PATH="$(dirname "$(find /usr/local/n/versions/node -path '*/22.*/bin/node' -print -quit)"):$PATH"
          node -v
          npm run build

      - name: Run unit tests
        shell: bash
        run: |
          n exec 22 npm test

  Notify:
    name: Send notifications
    runs-on: ubuntu-latest
    needs: [format-check, node-v22, node-v24]
    if: always()
    steps:
      - name: Notify Slack
        uses: baijunyao/action-slack-notify@v3.1.0
        if: ${{ github.event_name == 'push' }}
        with:
          slack_channel_id: actions-build-status
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          github_context: ${{ toJson(github) }}
