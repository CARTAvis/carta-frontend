name: carta-python compatibility

on:
    push:
        branches: [dev]
    pull_request:
        branches: [dev]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: Check API and enum compatibility
        runs-on: ubuntu-latest

        steps:
            - name: Checkout carta-frontend
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Checkout carta-python compatibility branch
              uses: actions/checkout@v6
              with:
                  repository: CARTAvis/carta-python
                  ref: zhenkai/157_validate_enums
                  path: carta-python

            - name: Install uv and set Python version
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: "3.11"
                  enable-cache: true

            - name: Sync Python environment
              working-directory: carta-python
              run: uv sync --locked --no-group dev

            - name: Generate carta-python manifests
              working-directory: carta-python
              run: |
                  set -euo pipefail
                  uv run --no-sync python scripts/extract_api.py \
                    --check \
                    --write-manifest \
                    --output "$RUNNER_TEMP/carta-python-api.json"
                  uv run --no-sync python scripts/extract_enum.py \
                    --write-manifest \
                    --output "$RUNNER_TEMP/carta-python-enum.json"

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install frontend dependencies
              run: npm ci --ignore-scripts

            - name: Build frontend protobuf types
              run: npm run build-protobuf

            - name: Check carta-python API manifest
              run: npm run check-python-api -- --manifest "$RUNNER_TEMP/carta-python-api.json"

            - name: Check carta-python enum manifest
              run: npm run check-python-enum -- --manifest "$RUNNER_TEMP/carta-python-enum.json"
